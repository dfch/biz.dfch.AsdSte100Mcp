name: Publish to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish-to-testpypi:
    name: Publish to TestPyPI
    env:
      # Opt-in to Node 24 to avoid Node 20 deprecation warnings (effective June 2026)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
    - name: Checkout
      # uses: actions/checkout@v5
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python
      # uses: actions/setup-python@v6
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: "3.11"

    - name: Install uv
      # uses: astral-sh/setup-uv@v5 v5.2.1
      uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca
      with:
        enable-cache: true

    - name: Verify tools
      run: |
        uv --version
        uv run --frozen python --version

    - name: Install dependencies
      run: uv sync --frozen --all-extras --python "3.11" # NOSONAR

    - name: Build sdist and wheel
      run: uv build

    - name: Publish to TestPyPI
      # uses: pypa/gh-action-pypi-publish@release/v1
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [publish-to-testpypi]
    env:
      # Opt-in to Node 24 to avoid Node 20 deprecation warnings (effective June 2026)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    environment: pypi
    steps:
    - name: Checkout
      # uses: actions/checkout@v5
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python
      # uses: actions/setup-python@v6
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: "3.11"

    - name: Install uv
      # uses: astral-sh/setup-uv@v5 v5.2.1
      uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca
      with:
        enable-cache: true

    - name: Verify tools
      run: |
        uv --version
        uv run --frozen python --version

    - name: Install dependencies
      run: uv sync --frozen --all-extras --python "3.11" # NOSONAR

    - name: Build sdist and wheel
      run: uv build

    - name: Publish to PyPI
      # uses: pypa/gh-action-pypi-publish@release/v1
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247

  create-github-release:
    name: Make GitHub Release
    needs: [publish-to-pypi]
    env:
      # Opt-in to Node 24 to avoid Node 20 deprecation warnings (effective June 2026)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      # uses: actions/checkout@v5
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python
      # uses: actions/setup-python@v6
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: "3.11"

    - name: Install uv
      # uses: astral-sh/setup-uv@v5 v5.2.1
      uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca
      with:
        enable-cache: true

    - name: Verify tools
      run: |
        uv --version
        uv run --frozen python --version
        gh --version

    - name: Install dependencies
      run: uv sync --frozen --all-extras --python "3.11" # NOSONAR

    - name: Build sdist and wheel
      run: uv build

    - name: Create GitHub Release
      run: |
        VERSION=${{ github.ref_name }}
        gh release create ${VERSION} --title "${VERSION}" --generate-notes || true
        gh release upload ${VERSION} dist/* --clobber

  publish-to-mcp-registry:
    name: Publish to MCP Registry
    needs: [publish-to-pypi]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout
      # uses: actions/checkout@v5
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Verify tools 1
      run: |
        curl --version
        jq --version
        cat --version

    - name: Install mcp-publisher
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
        chmod +x mcp-publisher

    - name: Verify tools 2
      run: |
        ./mcp-publisher --version

    - name: Update server.json version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
        cat server.json

    - name: Authenticate to MCP Registry (GitHub OIDC)
      run: ./mcp-publisher login github-oidc

    - name: Publish to MCP Registry
      run: ./mcp-publisher publish

